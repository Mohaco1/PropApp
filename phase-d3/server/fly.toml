# PharmLedger sync back end. Not deployed: deploying needs the owner's go-ahead (CLAUDE.md, D3).
app = "pharmledger-sync"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/pharmledger.db"
  APP_URL = "https://mohaco1.github.io/PropApp/"
  SES_REGION = "ap-southeast-2"
  TRUST_PROXY = "1"

[mounts]
  source = "pharmledger_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/v1/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
