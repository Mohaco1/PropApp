"person":"Priya Sharma","engagement":"Regular","start":"2023-11-20","annualDue":"2027-01-08","assuranceManaged":true,"changedAt":"2025-11-29T00:00:00.000Z","changePending":false,"lastAssurance":"2025-12-01"},{"id":"b669f070-d582-4fec-aaf4-f7e21856122d","role":"Pharmacist","services":["otp","vaccination"],"active":true,"person":"Tom Nguyen","engagement":"Regular","start":"2024-09-15","annualDue":"2026-12-03","assuranceManaged":true,"changedAt":"2025-11-29T00:00:00.000Z","changePending":false,"lastAssurance":"2025-12-01"},{"id":"7a873411-ef06-43a9-a57b-d55fd788259b","role":"Dispensary technician / assistant","services":["daa","delivery"],"active":true,"person":"Grace Li","engagement":"Regular","start":"2025-04-03","annualDue":"2027-03-24","assuranceManaged":true,"changedAt":"2025-11-29T00:00:00.000Z","changePending":false,"lastAssurance":"2025-12-01"},{"id":"a509d27b-5f5c-46c6-b85d-ae58aff0647d","role":"Pharmacy assistant","services":["delivery"],"active":true,"person":"Ben Carter","engagement":"Regular","start":"2026-11-06","annualDue":"2027-11-06","assuranceManaged":true,"changedAt":"2026-11-06T00:00:00.000Z","changePending":true}],"documents":[{"id":"0ae68bed-1e4d-49d7-b927-64d6b433ae2b","scope":"pharmacy","group":"Policies & procedures","title":"Dose administration aids SOP","catalogueId":"qsp-081","serviceProcedure":"daa","lifecycle":"Draft","versions":[{"id":"eed9afd7-0ba6-44bd-a2a6-67e4d570e72c","title":"Dose administration aids SOP","version":"0.2","status":"Draft","pharmacy":"Wattle Grove Pharmacy","at":"2025-11-27T00:00:00.000Z","body":"Dose administration aids — standard operating procedure\nDraft generated from Wattle Grove Pharmacy’s setup answers and the sources listed at the end. Review it, adjust it to how you work, and approve it in Policies. It is not legal advice.\n\n1. Purpose\nSupply medicines in dose administration aids (DAAs) that are prepared from current prescriptions, checked by a pharmacist, labelled and supplied as the Regulation 2026 requires.\n\n2. Scope\n• Packing: on-site packing.\n• Patients: Community patients.\n• Funding: Private (unfunded).\n• Schedule 8 medicines are packed in DAAs.\n\n3. Responsibilities\n• Registered pharmacist: confirms the medication list, checks every completed pack and is responsible for the DAA supplied.\n• Packs are prepared by: Technicians or assistants, Pharmacists, under pharmacist supervision.\n• Only a pharmacist places Schedule 8 medicines into packs.\n• Proprietor: makes sure this procedure is followed, that the packing area is not accessible to the public, and reviews DAA exceptions at the site visit.\n\n4. Procedure\n1. Before the first pack, obtain and keep the patient’s or carer’s agreement to DAA supply.\n2. Before packing, a pharmacist verifies the current medication list against the prescriptions.\n3. When medicines change, including after a hospital discharge, a pharmacist reviews the change before the next pack is prepared; superseded packs are withdrawn.\n4. Packing method: Manual blister packs (e.g. Webster-pak). Packing happens in an area the public cannot access (storage and access requirements).\n5. Completed packs containing Schedule 8 medicines are stored in the locked S8 safe; other completed packs are stored separately.\n6. A pharmacist checks every completed pack against the medication list before it is supplied.\n7. The final check is recorded: paper packing records (signed or initialled), electronic packing check record.\n8. Label every pack with: the information required by the Poisons Standard, Appendix L; the date the medicines were packed; the patient’s date of birth (Regulation 2026 s 136(1)).\n9. Never put medicines taken by mouth and medicines for external use only in the same pack (Regulation 2026 s 136(2)).\n10. Supply: collected from the pharmacy, delivered by pharmacy staff, delivered by courier. A pack is supplied only after it has been dispensed, packed and checked.\n11. Schedule 8 packs sent by courier: opaque packaging, properly addressed, nothing outside showing it holds S8; inside, a contents list headed “SCHEDULE 8/9—CHECK CAREFULLY” in bold capitals at least 12.5 mm high; keep evidence of consignment and get the signed, dated receipt back (Regulation 2026 s 190–191).\n12. Monitor how each patient is managing their DAA and follow up concerns, as the PSA DAA guidelines describe.\n13. Routine DAA check (a sample of packs and records): annual. This is the pharmacy’s own interval; the PPA rules set none.\n\n5. Records\n• Keep a record of the information on every DAA label (Regulation 2026 s 136(3)) for at least 2 years, available for inspection (Regulation 2026 s 185(3)).\n• Correct a record only with a marginal note or footnote, initialled and dated; never alter or obliterate an entry (Regulation 2026 s 185(2)).\n• [Confirm: where pack collection or delivery records are kept]\n\n6. Incidents and escalation\n• A wrong, missing or damaged pack: withdraw it, tell the pharmacist on duty, contact the patient (and prescriber if a dose was missed or wrong), and record what happened and what changed.\n• Recurring packing errors are raised at the next proprietor site visit as an action.\n\n7. Proprietor oversight\n• The proprietor reviews exceptions and open actions for this service at the site visit, and reviews this procedure at least annually or after a material change, incident or rule change.\n\n8. Confirm before adoption\n• Where pack collection or delivery records are kept\n• Check the steps match how your pharmacy works before approving.\n\n9. Sources\n• Medicines, Poisons and Therapeutic Goods Regulation 2026 (NSW), 2026 No 330: s 136, s 137, s 185, s 190–191.\n• Pharmacy Programs Administrator, DAA Program Rules (September 2026), for funded patients only.\n• Pharmacy Board of Australia guidelines on DAAs and PSA guidelines for a DAA service (referenced by the PPA rules; not reproduced here).\n• NSW Health, Dose Administration Aids (pharmacist guidance).","reviewerId":"a49985d5-3315-47f macist guidance).","updatedAt":"2025-11-27T00:00:00.000Z","siteSnapshot":{"siteId":"50ab9afe-f405-43bd-acf4-92b498f75c12","name":"Wattle Grove Pharmacy","address":"48 Wattle Grove Road, Fictional Heights NSW 2999","region":"","proprietor":"Jordan Avery"}},{"id":"a69a1ca5-31d7-4206-9870-5384bcf0c005","scope":"pharmacy","group":"Policies & procedures","title":"Opioid Treatment Program SOP","catalogueId":"qsp-064","serviceProcedure":"otp","lifecycle":"Draft","versions":[{"id":"62101824-67b6-4a10-9fd7-2cbe57c293c4","title":"Opioid Treatment Program SOP","version":"0.2","status":"Draft","pharmacy":"Wattle Grove Pharmacy","at":"2025-11-27T00:00:00.000Z","body":"Opioid Treatment Program — standard operating procedure\nDraft generated from Wattle Grove Pharmacy’s setup answers and the sources listed at the end. Review it, adjust it to how you work, and approve it in Policies. It is not legal advice.\n\n1. Purpose\nProvide opioid treatment program (OTP) dosing safely and as the NSW OTP Standards (November 2026) require. Complying with the Standards is required under the Regulation 2026.\n\n2. Scope\n• Medicines: Methadone oral liquid, Buprenorphine/naloxone sublingual films.\n• Supervised dosing and authorised take-away doses.\n• 80 or more patients have been dosed on one day: the amenity plan requirements apply (OTP Standards 3).\n\n3. Responsibilities\n• Only pharmacists prepare, supply or administer OTP medicines (OTP Standards 1(a)).\n• Proprietor: keeps the pharmacy approved as a PBS (section 90) pharmacy and notifies the Pharmaceutical Services Unit of changes to the pharmacy’s name, address or ownership (OTP Standards 2).\n• Proprietor: keeps a documented amenity plan, reviewed and updated every year, covering patient flow, a daily dosing plan, continuity, storage, security and staffing, with a signed staffing declaration (OTP Standards 3).\n\n4. Procedure\n1. Dispense OTP prescriptions only if this pharmacy is the patient’s nominated dosing point. Prescriptions and directions must come directly from the prescriber, never from the patient; keep physical repeats here (OTP Standards 5).\n2. Supervised dosing happens in: designated supervised dosing area.\n3. Record every supply in a compliant drug register, including the quantity of each observed dose, the number and quantity of take-away doses, and the days they cover (OTP Standards 6). Doses are recorded in PharmaDesk (fictional dispensing system).\n4. Paper subsidiary register: a bound book with numbered pages, one book per product, clear headings; record patient, prescription number, prescriber, quantity, date and take-away days; identify the dosing pharmacist; reconcile each day, sign it and enter the total in the main drug register (OTP Standards 7).\n5. Take-away doses are prepared upon patient collection, labelled as Schedule 8 and supplied in child-resistant packaging (OTP Standards 1(f)).\n6. Dosing equipment (manual pump) is maintained, cleaned and calibrated following its operating protocols (OTP Standards 1(e)).\n7. Store OTP medicines securely under the Medicine Storage Standards (OTP Standards 1(c)).\n8. Document clinical interventions and communication with prescribers and other providers involved in the patient’s care (OTP Standards 1(d)).\n9. [Confirm: write the steps for missed doses and intoxicated patients, following current NSW OTP guidance]\n10. [Confirm: write the steps for supervising film doses, following current NSW OTP guidance]\n\n5. Records\n• Drug register and subsidiary register entries as above; registers and records are kept for at least 2 years and available for inspection (Regulation 2026 s 185(3)).\n• Staff training records showing staff are trained for the service (OTP Standards 1(g)).\n• Patient files are kept in PharmaDesk (fictional dispensing system).\n\n6. Incidents and escalation\n• [Confirm: write the steps for reporting and notifying OTP incidents, following current NSW OTP guidance]\n• Register discrepancies are investigated and reported as the Regulation requires.\n\n7. Proprietor oversight\n• The proprietor checks the OTP procedure covers every part of OTP Standards item 1 (see “Your OTP procedure”), reviews OTP exceptions at the site visit and the monthly OTP check-in, and reviews this procedure at least annually.\n\n8. Confirm before adoption\n• Write the steps for missed doses and intoxicated patients, following current NSW OTP guidance\n• Write the steps for supervising film doses, following current NSW OTP guidance\n• Write the steps for reporting and notifying OTP incidents, following current NSW OTP guidance\n• Check the steps match how your pharmacy works before approving.\n\n9. Sources\n• NSW Opioid Treatment Program, OTP Standards (NSW Ministry of Health, November 2026): Standards for pharmacists practising at community pharmacy dosing points, items 1–7.\n• Medicines, Poisons and Therapeutic Goods Regulation 2026 (NSW), 2026 No 330: s 185.\n• Current NSW OTP clinical guidance (referenced; clinical steps are not written by R.Pharmacy).","reviewerId":"a49985d5-3315-47f3-871f-b55499b80beb","by":"Jordan Avery","source":"Reported service configuration","sourceNotes":[{"title":"NSW OTP Standards","url":"https://www.health.nsw.gov.au/pharmaceutical/Publications/opioid-treatment-program-standards.pdf","edition":"November 2026","basis":"Issued community pharmacy standard","locator":"Community items 1(e), 2, 3 and 6–7","scope":"Registered community OTP dosing point","status":"Standards text read (supplied November 2026): community pharmacy items 1–7","trigger":"Equipment protocol, change of site details, qualifying volume and relevant register route"}],"referenceTextStatus":"Full Draft 0.2 reference not supplied"}],"reviews":[],"owner":"Jordan Avery","version":"0.2","generatedBody":"Opioid Treatment Program — standard operating procedure\nDraft generated from Wattle Grove Pharmacy’s setup answers and the sources listed at the end. Review it, adjust it to how you work, and approve it in Policie  Write the steps for reporting and notifying OTP incidents, following current NSW OTP guidance\n• Check the steps match how your pharmacy works before approving.\n\n9. Sources\n• NSW Opioid Treatment Program, OTP Standards (NSW Ministry of Health, November 2026): Standards for pharmacists practising at community pharmacy dosing points, items 1–7.\n• Medicines, Poisons and Therapeutic Goods Regulation 2026 (NSW), 2026 No 330: s 185.\n• Current NSW OTP clinical guidance (referenced; clinical steps are not written by R.Pharmacy).","updatedAt":"2025-11-27T00:00:00.000Z","siteSnapshot":{"siteId":"50ab9afe-f405-43bd-acf4-92b498f75c12","name":"Wattle Grove Pharmacy","address":"48 Wattle Grove Road, Fictional Heights NSW 2999","region":"","proprietor":"Jordan Avery"}},{"id":"95a2aab1-bdd6-40e0-9a71-489bdfd4f2f3","scope":"pharmacy","group":"Policies & procedures","title":"Vaccination SOP","catalogueId":"qsp-091","serviceProcedure":"vaccination","lifecycle":"Draft","versions":[{"id":"11a9852f-6b18-4e7e-bd02-dcc1216bfcfe","title":"Vaccination SOP","version":"0.1","status":"Draft","pharmacy":"Wattle Grove Pharmacy","at":"2025-11-27T00:00:00.000Z","body":"Vaccination — standard operating procedure\nDraft generated from Wattle Grove Pharmacy’s setup answers and the sources listed at the end. Review it, adjust it to how you work, and approve it in Policies. It is not legal advice.\n\n1. Purpose\nGive vaccinations safely and keep every vaccine within +2°C to +8°C from delivery to administration, with complete records, as the Regulation 2026, the NSW Pharmacist Vaccination Standards and Strive for 5 require.\n\n2. Scope\n• Where: on site.\n• Vaccines offered: COVID-19, Influenza, Pneumococcal (Capvaxive or Prevenar 20), Zoster (Shingrix only), RSV (Arexvy or Abrysvo), Diphtheria/tetanus/pertussis (e.g. dTpa or ADT).\n• Funded programs: National Immunisation Program (NIP), NSW state-funded vaccines.\n• Covers ordering, receipt, storage, monitoring, transport, administration, incidents and records.\n\n3. Responsibilities\n• Pharmacist immuniser: gives vaccines without a prescription only under the Health Secretary’s authority and the approved standards (Regulation 2026 s 70(1)), holds training for each vaccine, and keeps it current.\n• Vaccine management lead (and a trained deputy): owns ordering, temperature records, logger reviews, incidents and the annual self-audit; the roster always covers one of them.\n• Every staff member who handles vaccines: has completed the NSW Health cold-chain module; certificates kept (NSW Health pharmacist immuniser guidance and Safe vaccine storage checklist; Strive for 5, 4th ed., §3.8, §§4.1–4.5).\n• Proprietor: provides the equipment, training and backup arrangements, and reviews every incident.\n\n4. Procedure\n1. Store vaccines only in a purpose-built vaccine fridge, never a domestic or bar fridge; keep the power outlet labelled “Do not switch off”; vaccines stay in original cartons in labelled baskets, funded and private apart, off the walls and vents; no food in the fridge (Strive for 5 / NSW Health, per your plan — verify).\n2. Twice on every open day, before using any vaccine: record the current, minimum and maximum temperature with time and initials, then reset the min/max; after weekends or closures, review the logger for the unattended period first (Strive for 5 / NSW Health, per your plan — verify).\n3. A data logger records continuously (5-minute intervals) and alarms outside +2°C to +8°C; download, review and save the readings and graph every week (NSW Health pharmacist immuniser guidance and Safe vaccine storage checklist; Strive for 5, 4th ed., §3.8, §§4.1–4.5).\n4. Temperature charts and logger files are kept in: Paper folder in the pharmacy.\n5. Deliveries: accept only when a trained person can unpack straight away; check the cold and heat indicators, names, quantities, batches and expiries; anything doubtful stays quarantined at +2°C to +8°C until the supplier or Public Health Unit advises (Strive for 5 / NSW Health, per your plan — verify).\n6. Every month and on each delivery: rotate stock so the earliest expiry is used first and list anything expiring within 2 months; never give an expired vaccine (Strive for 5 / NSW Health, per your plan — verify).\n7. Check eligibility, age, intervals, contraindications and AIR history against the NSW Pharmacist Vaccination Standards and the Australian Immunisation Handbook; get and record consent.\n8. Screening and consent are recorded in PharmaDesk (fictional dispensing system).\n9. Record for every vaccine: the person’s name, street address, date of birth and contact details; brand, batch and expiry; the site on the body; the date; the address where it was given; a reference number; and the immuniser’s name and contact details (Regulation 2026 s 70(2)). Keep evidence of training if the authority requires it (s 70(3)).\n10. Report every vaccine given to the Australian Immunisation Register.\n11. AIR reporting evidence is kept in: Paper folder in the pharmacy.\n12. Vaccinate in a clean, private area with an in-date anaphylaxis kit and trained support present; observe each person afterwards and tell them what reactions to expect.\n13. Anaphylaxis: give adrenaline as the Australian Immunisation Handbook directs, call 000 and stay with the person; record it and report it as an adverse event following immunisation. [Confirm: steps match the current Handbook]\n14. Off-site or emergency transport: a pre-chilled, monitored cooler with conditioned ice packs and insulation; confirm +2°C to +8°C before loading; check every 15 minutes for the first 2 hours, then hourly (Strive for 5 / NSW Health, per your plan — verify).\n\n5. Records\n• Temperature charts, logger reports, cooler charts and the storage self-audit: keep at least 2 years (NSW Health pharmacist immuniser guidance and Safe vaccine storage checklist; Strive for 5, 4th ed., §3.8, §§4.1–4.5); vaccination records as the Regulation requires (s 70, s 185).\n• Complete the national vaccine storage self-audit at least every 12 months, and after any breach or equipment change; service the vaccine fridge every 12 months (Strive for 5 / NSW Health, per your plan — verify).\n• Training and cold-chain certificates for everyone who handles vaccines.\n\n6. Incidents and escalation\n• Below +2°C, above +12°C, or +8°C to +12°C for 15 minutes or more: a cold-chain breach. Stop using the vaccines, quarantine them (“DO NOT USE”) at +2°C to +8°C, download the logger 24 hours either side, and report funded stock to the Public Health Unit straight away; ask the manufacturer about private stock; don’t discard anything until advised (Strive for 5 / NSW Health, per your plan — verify).\n• +8°C to +12°C for under 15 minutes with a clear reason: record the deviation and cause and keep monitoring; with no clear reason, treat it as a possible fridge fault and call the Public Health Unit (Strive for 5 / NSW Health, per your plan — verify).\n• Power failure: keep the fridge closed and monitor it; before it reaches +8°C, move vaccines to a monitored cooler or an agreed alternative vaccine fridge; when power returns, check it’s stable before restocking and monitor hourly for 4 hours (Strive for 5 / NSW Health, per your plan — verify).\n• A vaccination error or adverse event: look after the person, contact the Public Health Unit for advice, report suspected adverse events as NSW requires, and review at the site visit.\n\n7. Proprietor oversight\n• The proprietor reviews exceptions and open actions for this service at the site visit, and reviews this procedure at least annually or after a material change, incident or rule change.\n\n8. Confirm before adoption\n• Steps marked “— verify”: check each against the full official document before approving\n• Steps match the current Handbook\n• Steps marked “per your plan — verify”: check each against the current Strive for 5 and NSW Health cold-chain guidance\n• Check the steps match how your pharmacy works before approving.\n\n9. Sources\n• Medicines, Poisons and Therapeutic Goods Regulation 2026 (NSW), 2026 No 330: s 70, s 185.\n• National Vaccine Storage Guidelines “Strive for 5”, 4th edition (2025); NSW Health cold chain breach protocol and pharmacist vaccine ordering and storage guidance; PHN VAN toolkit (Sept 2026) — as used in your Vaccine Management Plan. Verify against the current editions before approving.\n• NSW Health table of vaccines pharmacist immunisers may give (supplied by the owner, 20 Nov 2026); NSW Pharmacist Vaccination Standards; Australian Immunisation Handbook.","reviewerId":"a49985d5-3315-47f3-871f-b55499b80beb","by":"Jordan Avery","source":"Reported service configuration","sourceNotes":[]}],"reviews":[],"owner":"Jordan Avery","version":"0.1","generatedBody":"Vaccination — standard operating procedure\nDraft generated from Wattle Grove Pharmacy’s setup answers and the sources listed at the end. Review it, adjust it to how you work, and approve it in Policies. It is not legal advice.\n\n1. Purpose\nGive vaccinations safely and keep every vaccine within +2°C to +8°C from delivery to administration, with complete records, as the Regulation 2026, the NSW Pharmacist Vaccination Standards and Strive for 5 require.\n\n2. Scope\n• Where: on site.\n• Vaccines offered: COVID-19, Influenza, Pneumococcal (Capvaxive or Prevenar 20), Zoster (Shingrix only), RSV (Arexvy or Abrysvo), Diphtheria/tetanus/pertussis (e.g. dTpa or ADT).\n• Funded programs: National Immunisation Program (NIP), NSW state-funded vaccines.\n• Covers ordering, receipt, storage, monitoring, transport, administration, incidents and records.\n\n3. Responsibilities\n• Pharmacist immuniser: gives vaccines without a prescription only under the Health Secretary’s authority and the approved standards (Regulation 2026 s 70(1)), holds training for each vaccine, and keeps it current.\n• Vaccine management lead (and a trained deputy): owns ordering, temperature records, logger reviews, incidents and the a atalogueId":"qsp-071","serviceProcedure":"staged","lifecycle":"Draft","versions":[{"id":"33474396-4e3b-4c60-8020-1ef2e9f86023","title":"Staged supply SOP","version":"0.1","status":"Draft","pharmacy":"Wattle Grove Pharmacy","at":"2025-11-27T00:00:00.000Z","body":"Staged supply — standard operating procedure\nDraft generated from Wattle Grove Pharmacy’s setup answers and the sources listed at the end. Review it, adjust it to how you work, and approve it in Policies. It is not legal advice.\n\n1. Purpose\nSupply medicines in instalments exactly as the prescriber directs, with consent, secure storage and follow-up of missed collections, meeting the PPA Staged Supply Program Rules for funded patients.\n\n2. Scope\n• Funding: PPA-funded.\n• Includes Schedule 8 medicines.\n• PPA funding covers patients referred by their prescriber who hold a concession card, live at home and take opioid analgesics, antipsychotics, anxiolytics, hypnotics/sedatives, antidepressants or psychostimulants; not aged care or hospital residents; up to 15 patients a month (PPA Staged Supply Rules 3.2, 6). OTP medicines are excluded.\n\n3. Responsibilities\n• Pharmacist: prepares, checks and supplies each instalment against the current direction.\n• Proprietor: reviews missed collections and exceptions at the site visit.\n\n4. Procedure\n1. Confirm the prescriber’s direction for staged supply before the first instalment (funded patients must be referred by their prescriber).\n2. Get the patient’s or carer’s consent before starting; for PPA-funded patients this must be written consent on the current PPA form (PPA Staged Supply Rules 3.3).\n3. Prepare instalments only from the current direction; record any change and where it came from.\n4. Prepare and supply instalments in the dispensary; store prepared instalments where the public can’t reach them, with Schedule 8 instalments in the S8 safe (Regulation 2026 s 122).\n5. Supply each instalment on the directed day, record it, and give no more than directed.\n6. A missed collection: the pharmacist reviews it the same day and contacts the patient and, where needed, the prescriber.\n7. Funded patients pay no extra charge for the service (PPA Staged Supply Rules 3.1).\n\n5. Records\n• Instalment records are kept in PharmaDesk (fictional dispensing system).\n• PPA: keep supporting documents for 7 years (consent, eligibility, medicines, instalment dates) and claim by the end of the next calendar month (Rules 7.1, 7.3, 8).\n• Records are kept for at least 2 years and available for inspection; corrections only by an initialled, dated marginal note (Regulation 2026 s 185).\n\n6. Incidents and escalation\n• Wrong instalment or quantity: tell the pharmacist, contact the patient and prescriber, record and review.\n\n7. Proprietor oversight\n• The proprietor reviews exceptions and open actions for this service at the site visit, and reviews this procedure at least annually or after a material change, incident or rule change.\n\n8. Confirm before adoption\n• Nothing outstanding from setup.\n• Check the steps match how your pharmacy works before approving.\n\n9. Sources\n• Medicines, Poisons and Therapeutic Goods Regulation 2026 (NSW), 2026 No 330: s 122, s 185.\n• Pharmacy Programs Administrator, Staged Supply Program Rules, September 2026.","reviewerId":"a49985d5-3315-47f3-871f-b55499b80beb","by":"Jordan Avery","source":"Reported service configuration","sourceNotes":[]}],"reviews":[],"owner":"Jordan Avery","version":"0.1","generatedBody":"Staged supply — standard operating procedure\nDraft generated from Wattle Grove Pharmacy’s setup answers and the sources listed at the end. Review it, adjust it to how you work, and approve it in Policies. It is not legal advice.\n\n1. Purpose\nSupply medicines in instalments exactly as the prescriber directs, with consent, secure storage and follow-up of missed collections, meeting the PPA Staged Supply Program Rules for funded patients.\n\n2. Scope\n• Funding: PPA-funded.\n• Includes Schedu ew.\n\n7. Proprietor oversight\n• The proprietor reviews exceptions and open actions for this service at the site visit, and reviews this procedure at least annually or after a material change, incident or rule change.\n\n8. Confirm before adoption\n• Nothing outstanding from setup.\n• Check the steps match how your pharmacy works before approving.\n\n9. Sources\n• Medicines, Poisons and Therapeutic Goods Regulation 2026 (NSW), 2026 No 330: s 122, s 185.\n• Pharmacy Programs Administrator, Staged Supply Program Rules, September 2026.","body":"Staged supply — standard operating procedure\nDraft generated from Wattle Grove Pharmacy’s setup answers and the sources listed at the end. Review it, adjust it to how you work, and approve it in Policies. It is not legal advice.\n\n1. Purpose\nSupply medicines in instalments exactly as the prescriber directs, with consent, secure storage and follow-up of missed collections, meeting the PPA Staged Supply Program Rules for funded patients.\n\n2. Scope\n• Funding: PPA-funded.\n• Includes Schedule 8 medicines.\n• PPA funding covers patients referred by their prescriber who hold a concession card, live at home and take opioid analgesics, antipsychotics, anxiolytics, hypnotics/sedatives, antidepressants or psychostimulants; not aged care or hospital residents; up to 15 patients a month (PPA Staged Supply Rules 3.2, 6). OTP medicines are excluded.\n\n3. Responsibilities\n• Pharmacist: prepares, checks and supplies each instalment against the current direction.\n• Proprietor: reviews missed collections and exceptions at the site visit.\n\n4. Procedure\n1. Confirm the prescriber’s direction for staged supply before the first instalment (funded patients must be referred by their prescriber).\n2. Get the patient’s or carer’s consent before starting; for PPA-funded patients this must be written consent on the current PPA form (PPA Staged Supply Rules 3.3).\n3. Prepare instalments only from the current direction; record any change and where it came from.\n4. Prepare and supply instalments in the dispensary; store prepared instalments where the public can’t reach them, with Schedule 8 instalments in the S8 safe (Regulation 2026 s 122).\n5. Supply each instalment on the directed day, record it, and give no more than directed.\n6. A missed collection: the pharmacist reviews it the same day and contacts the patient and, where needed, the prescriber.\n7. Funded patients pay no extra charge for the service (PPA Staged Supply Rules 3.1).\n\n5. Records\n• Instalment records are kept in PharmaDesk (fictional dispensing system).\n• PPA: keep supporting documents for 7 years (consent, eligibility, medicines, instalment dates) and claim by the end of the next calendar month (Rules 7.1, 7.3, 8).\n• Records are kept for at least 2 years and available for inspection; corrections only by an initialled, dated marginal note (Regulation 2026 s 185).\n\n6. Incidents and escalation\n• Wrong instalment or quantity: tell the pharmacist, contact the patient and prescriber, record and review.\n\n7. Proprietor oversight\n• The proprietor reviews exceptions and open actions for this service at the site visit, and reviews this procedure at least annually or after a material change, incident or rule change.\n\n8. Confirm before adoption\n• Nothing outstanding from setup.\n• Check the steps match how your pharmacy works before approving.\n\n9. Sources\n• Medicines, Poisons and Therapeutic Goods Regulation 2026 (NSW), 2026 No 330: s 122, s 185.\n• Pharmacy Programs Administrator, Staged Supply Program Rules, September 2026.","updatedAt":"2025-11-27T00:00:00.000Z","siteSnapshot":{"siteId":"50ab9afe-f405-43bd-acf4-92b498f75c12","name":"Wattle Grove Pharmacy","address":"48 Wattle Grove Road, Fictional Heights NSW 2999","region":"","proprietor":"Jordan Avery"}}],"auditSetup":{},"flags":{"house":true,"routeA":false,"routeB":false,"stagedFund":true,"inject":false,"volume":true},"pharmacyName":"Wattle Grove Pharmacy","onboarded":true,"fi       ws: (c, d) => c.go(d.a, { id: d.id }),
      begin: (c, d, el, r) => {
        const extra = c.ui.visitExtra ?? !!r.extra;
        c.ui.visitExtra = void 0;
        if (!c.draft(key(extra))) c.saveDraft(key(extra), { date: today(), items: {}, vacc: {}, notes: "", next: "", step: 0 });
        c.replace("visit", { extra });
      },
      copy: async (c) => {
        const ws = worthSeeing(c.ph);
        const t = c.ph.name + " \xB7 site visit " + fmt(today()) + "\n" + (ws.length ? ws.map((w) => "- " + w.title + " (" + w.why + ")").join("\n") : "Nothing open from earlier visits.") + "\nNo patient names or identifiers, please.";
        try {
          await navigator.clipboard.writeText(t);
          c.toast("Copied. Paste it into a message.");
        } catch {
          c.toast("Copy didn\u2019t work here. Long-press to select the list instead.");
        }
      }
    }
  });
  register("visit", {
    tab: "today",
    render(c, r) {
      const k = key(r.extra), d = c.draft(k);
      if (!d) return screen({ title: "Site visit", back: true, body: empty("This visit has finished.") });
      const items2 = visitItems(c.ph), step = Math.min(d.step || 0, items2.length);
      const prog = h`<div class="prog">${items2.map((it2, i) => h`<i class="${i === step ? "cur" : d.items[it2.key]?.status === "issue" ? "bad" : d.items[it2.key]?.status ? "done" : ""}"></i>`)}</div>`;
      const title = r.extra ? "Extra visit" : "Quarterly visit";
      if (step >= items2.length) return finish(c, r, d, items2, prog, title);
      const it = items2[step], a = d.items[it.key] || {}, last = lastVisitIssue(c.ph, it.key);
      const stillOpen = openFromVisits(c.ph).filter((x) => x.source.item === it.title);
      return screen({ title, back: true, saved: "Saved", body: h`${prog}
      <p class="steps">Check ${step + 1} of ${items2.length}</p><h2 class="big-title">${it.title}</h2>
      ${why("What to check", it.guide)}
      ${last ? note(h`Last time (${fmt(last.date)}): ${last.text}${last.closed ? " \xB7 fixed " + fmt(last.closed) : ""}`, last.closed ? "ok" : "warn") : ""}
      ${stillOpen.map((x) => h`<div class="card wait"><p class="eyebrow">Still open from an earlier visit</p><p>${x.title}</p>${btn("Seen the fix? Close it", "ws", { data: { id: x.id } })}</div>`)}
      <form data-form="ans" class="form" data-change="ans">${choice("status", ANS.map(([v, l]) => ({ value: v, label: l })), a.status || "", { issueValues: ["issue"] })}
        ${a.status === "issue" ? h`${field("What did you find?", textArea("text", a.text || "", { rows: 2 }))}${field("Fix by", textInput("due", a.due || addDays(today(), 30), { type: "date" }))}` : ""}
        ${a.status === "verify" ? field("What do you need to check?", textArea("text", a.text || "", { rows: 2 })) : ""}
        ${!it.core && ["staged", "vaccination"].includes(it.service) && a.status && a.status !== "na" ? field("Evidence reference (optional)", textInput("ref", a.ref || "", { placeholder: "Where you saw it, e.g. fridge log folder" })) : ""}
        ${it.service === "vaccination" ? vacc(d.vacc || {}) : ""}
      </form>
      <div class="btnrow">${btn("Previous", "step", { data: { s: step - 1 }, disabled: step === 0 })}${btn(step === items2.length - 1 ? "Finish" : "Next", "step", { kind: "primary", data: { s: step + 1 } })}</div>` });
    },
    changes: {
      ans: (c, el, r) => {
        const form = el.closest("form");
        const k = key(r.extra), d = structuredClone(c.draft(k));
        const it = visitItems(c.ph)[d.step || 0];
        const f = Object.fromEntries(new FormData(form));
        d.items[it.key] = { ...d.items[it.key] || {}, status: f.status || "", text: f.text ?? d.items[it.key]?.text ?? "", due: f.due ?? d.items[it.key]?.due ?? "", ref: f.ref ?? d.items[it.key]?.ref ?? "" };
        if ("vaccEvent" in f || "vaccSighted" in f) d.vacc = { event: f.vaccEvent || "", sighted: f.vaccSighted || "", auditDate: f.vaccDate || "" };
        const redraw = (f.status || "") !== (c.draft(k).items[it.key]?.status || "") || "vaccSighted" in f && f.vaccSighted !== c.draft(k).vacc?.sighted;
        c.saveDraft(k, d);
        if (redraw) c.rerender();
      }
    },
    acts: {
      step: (c, dd, el, r) => {
        const k = key(r.extra), d = structuredClone(c.draft(k));
        d.step = Math.max(0, +dd.s);
        c.saveDraft(k, d);
        c.rerender();
        window.scrollTo(0, 0);
      },
      ws: (c, d) => c.go("action", { id: d.id }),
      save: (c, d, el, r) => save(c, r),
      discard: (c, d, el, r) => {
        if (c.ui.discardArmed !== r.extra) {
          c.ui.discardArmed = r.extra;
          c.toast("Tap \u201CDiscard this visit\u201D again to delete its answers.");
          return;
        }
        c.ui.discardArmed = void 0;
        c.saveDraft(key(r.extra), null);
        c.back();
        c.toast("Visit discarded");
      }
    },
    forms: { fin: () => {
    } }
  });
  function vacc(v) {
    return h`<div class="card"><p class="field-label">Since the last visit, was there a cold-chain breach or fridge failure?</p>${choice("vaccEvent", [{ value: "yes", label: "Yes" }, { value: "no", label: "No" }], v.event || "")}
    <p class="field-label">Did you see this year’s vaccine storage self-audit?</p>${choice("vaccSighted", [{ value: "yes", label: "Yes" }, { value: "no", label: "Not yet" }], v.sighted || "")}
    ${v.sighted === "yes" ? field("Self-audit date", textInput("vaccDate", v.auditDate || "", { type: "date", max: today() })) : ""}</div>`;
  }
  function finish(c, r, d, items2, prog, title) {
    const missing = items2.map((it, i) => ({ it, i, a: d.items[it.key] || {} })).filter((x) => !x.a.status || x.a.status === "issue" && !x.a.text?.trim());
    const issues = items2.filter((it) => d.items[it.key]?.status === "issue").length;
    const q1 = reviewDue(c.ph, "Q1"), next = d.next || (r.extra ? "" : addMonths(today(), 3));
    return screen({ title, back: true, saved: "Saved", body: h`${prog}<h2 class="big-title">Finish the visit</h2>
    ${missing.length ? h`<section class="sec"><h2 class="sec-title">Still to answer · ${missing.length}</h2><div class="list">${missing.map((x) => row({ title: x.it.title, sub: x.a.status === "issue" ? "Say what you found" : "Not answered yet", act: "step", data: { s: x.i } }))}</div></section>` : note(issues ? issues + (issues === 1 ? " issue becomes an action." : " issues become actions.") + " You close each one once you\u2019ve seen it fixed." : "Every check answered. No issues.", issues ? "warn" : "ok")}
    <form class="form" data-form="fin" data-change="fin">${field("Visit note (optional)", textArea("notes", d.notes || "", { rows: 3 }))}
      ${r.extra ? note("Your quarterly visit date stays " + (q1 ? fmt(q1) : "unset") + ".") : field("Next quarterly visit", textInput("next", next, { type: "date", min: today() }))}</form>
    ${btn("Save visit", "save", { kind: "primary", cls: "block", disabled: missing.length > 0 })}
    ${btn("Discard this visit", "discard", { kind: "link" })}` });
  }
  register("visit-fin-hook", { render: () => "" });
  function save(c, r) {
    const k = key(r.extra), d = c.draft(k), items2 = visitItems(c.ph);
    const form = document.querySelector("form[data-form=fin]");
    const f = form ? Object.fromEntries(new FormData(form)) : {};
    if (items2.some((it) => !d.items[it.key]?.status)) return;
    c.change((ph) => {
      const rec = addRecord(ph, {
        type: "Q1",
        kind: "visit",
        extra: !!r.extra,
        title: r.extra ? "Extra site visit" : "Site visit",
        date: d.date,
        notes: (f.notes || "").trim(),
        next: r.extra ? "" : f.next,
        answers: items2.map((it) => {
          const a = d.items[it.key];
          return { item: it.key, text: it.title, answer: C.visit.answerText[a.status] || a.status, note: (a.text || "").trim(), ref: a.ref || "" };
        }),
        fields: { vacc: d.vacc || {} }
      });
      for (const it of items2) {
        const a = d.items[it.key];
        if (a.status !== "issue") continue;
        const ac = newAction(ph, { title: a.text.trim(), due: a.due, source: { type: "visit", recordId: rec.id, label: (r.extra ? "Extra visit" : "Site visit") + " \xB7 " + d.date, item: it.title } });
        rec.actionIds.push(ac.id);
      }
      if (!r.extra && isDate(f.next)) ph.schedule.Q1 = f.next;
    }, "Visit saved");
    c.saveDraft(k, null);
    c.tab("today");
  }

  // src/main.js
  var st = document.createElement("style");
  st.textContent = styles_default;
  document.head.append(st);
  start(document.getElementById("app"));
})();
