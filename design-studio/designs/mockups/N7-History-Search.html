<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History · search your record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#fff;font-family:Inter,system-ui,sans-serif;color:#111827}
button{font-family:inherit;cursor:pointer}
h2{margin:16px 0 4px;font-size:14px;font-weight:700;color:#4b5563}
.res{width:100%;min-height:60px;border:0;border-bottom:1px solid #eef0f3;background:#fff;text-align:left;display:flex;gap:12px;align-items:center;padding:8px 0;color:#111827}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 2px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #d1d5db;background:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:#111827;color:#fff;border-color:#111827}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="padding:14px 16px 4px;display:flex;flex-direction:column;gap:10px">
    <h1 style="margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em">History</h1>
    <label style="display:flex;align-items:center;gap:10px;min-height:52px;border-radius:14px;background:#f3f4f6;padding:0 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex:0 0 auto"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" value="fridge" aria-label="Search your record" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;outline:none">
      <span style="font-size:14px;color:#4b5563;white-space:nowrap">6 results</span>
    </label>
    <div style="display:flex;gap:8px;overflow-x:auto"><button class="chip" aria-pressed="true">Everything</button><button class="chip" aria-pressed="false">Visits</button><button class="chip" aria-pressed="false">Tasks</button><button class="chip" aria-pressed="false">SOPs</button><button class="chip" aria-pressed="false">Photos</button></div>
  </div>
  <div style="flex:1;overflow:auto;padding:0 16px 12px">
    <h2>Tasks</h2>
    <button class="res"><span class="ic" style="background:#ecf8f0;color:#15803d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Fix <mark>fridge</mark> log gaps</span><span style="font-size:14px;color:#4b5563">Closed 26 Nov · you checked the fix</span></span></button>
    <h2>Site visits</h2>
    <button class="res"><span class="ic" style="background:#fdf2f1;color:#b42318"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Medicine storage and stock: Issue</span><span style="font-size:14px;color:#4b5563">18 Nov · “<mark>Fridge</mark> log missed two readings”</span></span></button>
    <button class="res"><span class="ic" style="background:#ecf8f0;color:#15803d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Medicine storage and stock: Satisfactory</span><span style="font-size:14px;color:#4b5563">23 Sep · <mark>fridge</mark> readings complete</span></span></button>
    <h2>Photos</h2>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 0">
      <button aria-label="Fridge temperature log, week of 16 Nov" style="aspect-ratio:3/4;border:0;border-radius:10px;background:#f5f1e6;padding:8px;display:flex;flex-direction:column;gap:5px;justify-content:flex-start"><i style="display:block;height:6px;width:60%;background:#3d3a33;border-radius:2px;opacity:.7"></i><i style="display:block;height:4px;background:#8f8a7c;border-radius:2px"></i><i style="display:block;height:4px;background:#8f8a7c;border-radius:2px"></i><i style="display:block;height:4px;background:#8f8a7c;border-radius:2px"></i><i style="display:block;height:4px;width:70%;background:#8f8a7c;border-radius:2px"></i></button>
      <button aria-label="Fridge temperature log, week of 23 Nov" style="aspect-ratio:3/4;border:0;border-radius:10px;background:#f5f1e6;padding:8px;display:flex;flex-direction:column;gap:5px;justify-content:flex-start"><i style="display:block;height:6px;width:60%;background:#3d3a33;border-radius:2px;opacity:.7"></i><i style="display:block;height:4px;background:#8f8a7c;border-radius:2px"></i><i style="display:block;height:4px;background:#8f8a7c;border-radius:2px"></i><i style="display:block;height:4px;background:#8f8a7c;border-radius:2px"></i><i style="display:block;height:4px;background:#8f8a7c;border-radius:2px"></i></button>
      <p style="margin:auto 0;text-align:center;font-size:13px;color:#4b5563;line-height:1.35;align-self:center">2 <mark>fridge</mark> log photos, labelled when taken</p>
    </div>
    <h2>SOPs</h2>
    <button class="res"><span class="ic" style="background:#eef2ff;color:#1e3a8a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6zM9 12h6M9 16h4"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Vaccination SOP: where <mark>fridge</mark> records are kept</span><span style="font-size:14px;color:#4b5563">Answered 2 Nov · needs verification</span></span></button>
  </div>
  <div style="padding:10px 16px 18px;border-top:1px solid #eef0f3">
    <button type="button" style="width:100%;min-height:56px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:16px;font-weight:700">Save these 6 results as a PDF</button>
  </div>
</div>
<script>document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})}});</script>
</body>
</html>
