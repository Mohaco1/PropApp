<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6 Field Ledger · Site visit check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1d4ed8}a:hover{color:#1e40af}
button{font-family:inherit}
::selection{background:#fde7b0;color:#111827}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #111827; font-family: Inter, system-ui, sans-serif;">
  <div style="padding: 8px 8px 0; display: flex; align-items: center; gap: 4px;">
    <button type="button" aria-label="Close visit" style="width: 44px; height: 44px; border: 0; background: transparent; color: #111827; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span style="flex: 1; font-size: 15px; font-weight: 600;">Site visit · Harbourview</span>
    <span style="padding-right: 12px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">2 of 6</span>
  </div>
  <div aria-hidden="true" style="margin: 4px 16px 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px;"><span style="height: 6px; border-radius: 3px; background: #15803d;"></span><span style="height: 6px; border-radius: 3px; background: #111827;"></span><span style="height: 6px; border-radius: 3px; background: #eef0f3;"></span><span style="height: 6px; border-radius: 3px; background: #eef0f3;"></span><span style="height: 6px; border-radius: 3px; background: #eef0f3;"></span><span style="height: 6px; border-radius: 3px; background: #eef0f3;"></span></div>

  <div style="flex: 1; overflow: hidden; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15;">Medicine storage and stock</h1>
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <span style="font-size: 13px; font-weight: 600; color: #1e3a8a; background: #eef2ff; border-radius: 6px; padding: 3px 8px;">§ Storage standards</span>
        <span style="font-size: 14px; color: #4b5563;">Last visit: Satisfactory · 23 Sep</span>
      </div>
    </div>

    <div role="radiogroup" aria-label="Result" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      
        <button type="button" role="radio" aria-checked="false" style="min-height: 76px; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left; color: #15803d; background: #ecf8f0; border: 2px solid transparent;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg><span style="font-size: 16px; font-weight: 700;">Satisfactory</span></button>
      
        <button type="button" role="radio" aria-checked="true" style="min-height: 76px; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left; color: #ffffff; background: #b42318; border: 2px solid #b42318;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v6M12 17h.01"></path></svg><span style="font-size: 16px; font-weight: 700;">Issue</span></button>
      
        <button type="button" role="radio" aria-checked="false" style="min-height: 76px; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left; color: #8a4b00; background: #fff6e5; border: 2px solid transparent;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"></path></svg><span style="font-size: 16px; font-weight: 700;">Needs verification</span></button>
      
        <button type="button" role="radio" aria-checked="false" style="min-height: 76px; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left; color: #4b5563; background: #f3f4f6; border: 2px solid transparent;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h12"></path></svg><span style="font-size: 16px; font-weight: 700;">Not applicable</span></button>
      
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 16px; font-weight: 700;">What did you find?</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        
          <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #ffffff; background: #b42318; border: 1px solid #b42318;">Fridge log gaps</button>
        
          <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #111827; background: #ffffff; border: 1px solid #d1d5db;">Expired stock</button>
        
          <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #111827; background: #ffffff; border: 1px solid #d1d5db;">Recall not actioned</button>
        
          <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #111827; background: #ffffff; border: 1px solid #d1d5db;">Storage too warm</button>
        
          <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #111827; background: #ffffff; border: 1px solid #d1d5db;">Something else</button>
        
      </div>
    </div>

    <div style="border-radius: 14px; background: #fdf2f1; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 700; color: #7f1d1d;">Task: Fix fridge log gaps</span><span style="font-size: 14px; color: #7f1d1d;">Due 25 Nov · stays open until you check the fix</span></span>
      <button type="button" style="min-height: 44px; border: 0; background: transparent; color: #7f1d1d; padding: 0 4px; font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px;">Edit</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; padding: 0 16px 18px;">
    <button type="button" style="min-height: 56px; border: 1px solid #d1d5db; border-radius: 14px; background: #ffffff; color: #111827; font-size: 16px; font-weight: 600;">Previous</button>
    <button type="button" style="min-height: 56px; border: 0; border-radius: 14px; background: #111827; color: #ffffff; font-size: 16px; font-weight: 700;">Save · next check</button>
  </div>
</div>
</body></html>
