<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CapWords → snap evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1d4ed8}a:hover{color:#1e40af}
button{font-family:inherit}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0b0d11; color: #ffffff; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden;">
  <div style="padding: 8px 8px 0; display: flex; align-items: center; gap: 4px; position: relative; z-index: 2;">
    <button type="button" aria-label="Close camera" style="width: 44px; height: 44px; border: 0; background: transparent; color: #ffffff; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span style="flex: 1; font-size: 15px; font-weight: 600;">Evidence · Medicine storage</span>
  </div>

  <div aria-label="Camera view of a paper fridge temperature log" role="img" style="position: relative; margin: 10px 20px 0; height: 400px; border-radius: 22px; background: radial-gradient(120% 90% at 50% 30%, #3a3f48 0%, #1b1e24 70%); overflow: hidden;">
    <div style="position: absolute; left: 56px; top: 54px; width: 238px; height: 300px; background: #f5f1e6; border-radius: 4px; transform: rotate(-4deg); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); padding: 18px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px;">
      <span style="height: 10px; width: 60%; background: #3d3a33; border-radius: 2px; opacity: 0.75;"></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: transparent; border-radius: 2px;"></span><span style="height: 6px; background: transparent; border-radius: 2px;"></span></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: transparent; border-radius: 2px;"></span><span style="height: 6px; background: transparent; border-radius: 2px;"></span></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span></span>
      
        <span style="display: grid; grid-template-columns: 30% 25% 25%; gap: 8px;"><span style="height: 6px; background: #8f8a7c; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span><span style="height: 6px; background: #5b6573; border-radius: 2px;"></span></span>
      
    </div>
    <div style="position: absolute; left: 24px; top: 26px; transform: rotate(-7deg); background: #ffffff; color: #111827; border-radius: 12px; padding: 8px 12px; font-size: 15px; font-weight: 700; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);">Fridge temperature log</div>
    <div style="position: absolute; right: 22px; top: 210px; transform: rotate(5deg); background: #fde68a; color: #422006; border-radius: 12px; padding: 8px 12px; font-size: 15px; font-weight: 700; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);">Week of 16 Nov</div>
    <div aria-hidden="true" style="position: absolute; inset: 14px; border-radius: 16px; border: 2px solid rgba(255, 255, 255, 0.55); clip-path: polygon(0 0, 18% 0, 18% 2%, 2% 2%, 2% 14%, 0 14%, 0 86%, 2% 86%, 2% 98%, 18% 98%, 18% 100%, 82% 100%, 82% 98%, 98% 98%, 98% 86%, 100% 86%, 100% 14%, 98% 14%, 98% 2%, 82% 2%, 82% 0, 100% 0, 100% 100%, 0 100%);"></div>
  </div>

  <div style="margin-top: auto; background: #ffffff; color: #111827; border-radius: 24px 24px 0 0; padding: 18px 16px 18px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 18px; font-weight: 700;">Attach to this visit check?</span>
      <span style="font-size: 14px; line-height: 1.45; color: #4b5563;">Medicine storage and stock · site visit 18 Nov. Labels are suggestions; edit them if they’re wrong.</span>
    </div>
    <div style="border-radius: 12px; background: #fff6e5; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a4b00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px;"><path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z"></path></svg>
      <span style="font-size: 14px; line-height: 1.4; color: #5c3200;">Check there are no patient names or labels in the photo before saving.</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 10px;">
      <button type="button" style="min-height: 56px; border: 1px solid #d1d5db; border-radius: 14px; background: #ffffff; color: #111827; font-size: 16px; font-weight: 600;">Retake</button>
      <button type="button" style="min-height: 56px; border: 0; border-radius: 14px; background: #111827; color: #ffffff; font-size: 16px; font-weight: 700;">Attach photo</button>
    </div>
  </div>
</div>
</body></html>
