<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Mix · Site visit check</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f6fa;--ink:#141a26;--muted:#4a5468;--line:#d5dbe6;--navy:#1f2a3d;--blue:#1d4ed8;--blue-soft:#eaf0fd;
--red:#b42318;--red-soft:#fdecea;--amber:#8a4b00;--amber-soft:#fff3dc;--green:#166534;--green-soft:#e7f6ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
.screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg)}
.screen>*{flex-shrink:0}
.scroll{flex:1 1 auto;overflow:auto;padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex-shrink:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.site{min-height:44px;border:0;background:transparent;padding:0;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px}
.me{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.lede{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
h2{margin:12px 0 0;font-size:15px;font-weight:700;color:var(--ink)}
.row{width:100%;min-height:68px;border:1.5px solid var(--navy);border-radius:14px;background:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left}
.row .t{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.row .n{font-size:16px;font-weight:700;line-height:1.25}
.row .s{font-size:14px;color:var(--muted)}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.p-red{background:var(--red-soft);color:var(--red)}.p-amber{background:var(--amber-soft);color:var(--amber)}.p-green{background:var(--green-soft);color:var(--green)}.p-blue{background:var(--blue-soft);color:var(--blue)}.p-grey{background:#eef1f6;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:84px;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile b{font-size:28px;font-weight:800;line-height:1}
.tile span{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.tile.on{border-color:var(--blue);background:var(--blue-soft)}
.seg{display:flex;gap:4px}.seg i{flex:1;height:6px;border-radius:3px;background:#dfe4ec;display:block}.seg i.d{background:var(--navy)}.seg i.c{background:var(--blue)}
.cta{min-height:54px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;width:100%}
.ghost{min-height:54px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:16px;font-weight:600;width:100%}
.foot{padding:10px 16px 16px;display:flex;gap:10px;background:var(--bg)}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 6px 12px}
nav.tabs button{min-height:54px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current=page]{color:var(--blue)}
.check{display:flex;align-items:center;gap:12px;min-height:48px;font-size:15px;font-weight:600}
.box{width:24px;height:24px;border-radius:6px;border:2px solid var(--navy);display:grid;place-items:center;flex:0 0 auto;background:#fff}
.box.on{background:var(--blue);border-color:var(--blue);color:#fff}
.alert{border-radius:14px;background:var(--amber-soft);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.chip{font-size:13px;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:2px 8px}
</style></head><body><div class="screen">
<div class="top" style="padding-bottom:0"><button type="button" class="site" aria-label="Back" style="width:44px;justify-content:flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><span style="flex:1;font-size:15px;font-weight:700">Site visit · Harbourview</span><span style="font-size:14px;font-weight:600;color:var(--muted);padding-right:4px">2 of 6</span></div>
<div style="padding:8px 16px 0"><div class="seg" aria-hidden="true"><i class="d"></i><i class="c"></i><i></i><i></i><i></i><i></i></div></div>
<div class="scroll" style="padding-top:14px">
  <h1 style="font-size:26px">Medicine storage and stock</h1>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip">§ Storage standards</span><span style="font-size:14px;color:var(--muted)">Last visit: Satisfactory · 8 Sep</span></div>
  <div role="radiogroup" aria-label="Result" id="ans" style="display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--navy);border-radius:14px;overflow:hidden;background:#fff"></div>
  <label for="f" style="font-size:15px;font-weight:700;margin-top:4px">What did you find?</label>
  <textarea id="f" rows="2" style="font:inherit;font-size:15px;line-height:1.45;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;background:#fff">Out-of-date stock found in the returns area.</textarea>
  <button type="button" class="ghost" style="min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>Snap evidence</button>
  <div style="border-radius:14px;background:#fff;border:1.5px solid var(--line);padding:6px 14px">
    <button type="button" class="check" id="tk" style="border:0;background:transparent;padding:0;width:100%;text-align:left"><span class="box on" id="tkb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></span><span style="flex:1">Create a Task to follow this up</span></button>
    <div id="tkd" style="font-size:14px;color:var(--muted);padding:0 0 10px 36px">“Clear out-of-date stock from returns” · due in 7 days · you can edit it</div>
  </div>
</div>
<div class="foot"><button type="button" class="ghost" style="flex:1">Previous</button><button type="button" class="cta" style="flex:2">Save · next check</button></div></div><script>var A=[['Satisfactory','#166534','#e7f6ec'],['Issue','#b42318','#fdecea'],['Needs verification','#8a4b00','#fff3dc'],['Not applicable','#4a5468','#eef1f6']],cur=1,el=document.getElementById('ans');
function d(){el.innerHTML=A.map(function(a,i){var on=i===cur;return '<button type="button" role="radio" aria-checked="'+on+'" data-i="'+i+'" style="min-height:58px;border:0;'+(i%2===0?'border-right:1.5px solid #d5dbe6;':'')+(i<2?'border-bottom:1.5px solid #d5dbe6;':'')+'background:'+(on?a[2]:'#fff')+';display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;font-weight:'+(on?700:500)+';color:'+(on?a[1]:'#141a26')+';text-align:left"><span style="width:12px;height:12px;border-radius:3px;background:'+a[1]+';flex:0 0 auto"></span>'+a[0]+'</button>'}).join('');el.querySelectorAll('button').forEach(function(b){b.onclick=function(){cur=+b.dataset.i;d()}})}d();
var on=true;document.getElementById('tk').onclick=function(){on=!on;var b=document.getElementById('tkb');b.className='box'+(on?' on':'');b.innerHTML=on?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>':'';document.getElementById('tkd').style.display=on?'block':'none'};</script></body></html>
