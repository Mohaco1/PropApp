<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6 Field Ledger · Setup question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1d4ed8}a:hover{color:#1e40af}
button{font-family:inherit}
::selection{background:#fde7b0;color:#111827}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #111827; font-family: Inter, system-ui, sans-serif; position: relative;">
  <div style="padding: 8px 8px 0; display: flex; align-items: center; gap: 4px;">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: #111827; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <span style="flex: 1; font-size: 15px; font-weight: 600;">DAA setup · 4 of 15</span>
    <button type="button" style="min-height: 44px; border: 0; background: transparent; padding: 0 10px; color: #1d4ed8; font-size: 15px; font-weight: 600;">Finish later</button>
  </div>
  <div aria-hidden="true" style="margin: 4px 16px 0; height: 6px; border-radius: 3px; background: #eef0f3;"><div style="width: 27%; height: 6px; border-radius: 3px; background: #111827;"></div></div>

  <div style="flex: 1; padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15;">Who checks the medication list before packing?</h1>
    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <span style="font-size: 13px; font-weight: 600; color: #1e3a8a; background: #eef2ff; border-radius: 6px; padding: 3px 8px;">§ Pharmacy Board DAA guideline</span>
      <span style="font-size: 14px; color: #4b5563;">A wrong list means a wrong pack.</span>
    </div>

    <div role="radiogroup" aria-label="Answer" style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px;">
      
        <button type="button" role="radio" aria-checked="true" style="min-height: 72px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px; text-align: left; color: #111827; background: #f3f4f6; border: 2px solid #111827;"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; box-sizing: border-box; border: 2px solid #111827;"><span style="width: 12px; height: 12px; border-radius: 50%; background: #111827;"></span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">A pharmacist verifies it</span><span style="font-size: 14px; color: #4b5563;">Before any packing starts</span></span></button>
      
        <button type="button" role="radio" aria-checked="false" style="min-height: 72px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px; text-align: left; color: #111827; background: #ffffff; border: 1px solid #d1d5db;"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; box-sizing: border-box; border: 2px solid #9ca3af;"><span style="width: 12px; height: 12px; border-radius: 50%; background: transparent;"></span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">Different local arrangement</span><span style="font-size: 14px; color: #4b5563;">A box opens here to describe it in one line</span></span></button>
      
        <button type="button" role="radio" aria-checked="false" style="min-height: 72px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px; text-align: left; color: #111827; background: #ffffff; border: 1px solid #d1d5db;"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; box-sizing: border-box; border: 2px solid #9ca3af;"><span style="width: 12px; height: 12px; border-radius: 50%; background: transparent;"></span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">No documented check yet</span><span style="font-size: 14px; color: #4b5563;">Adds a Task to help you set one up</span></span></button>
      
    </div>

    <div style="border-radius: 14px; background: #f6f7f9; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 14px; font-weight: 600; color: #374151;">In your DAA SOP this reads:</span>
      <span style="font-size: 16px; line-height: 1.45;">“A pharmacist verifies the current medication list before any packing starts.”</span>
    </div>

    <button type="button" style="margin-top: auto; min-height: 52px; border: 1px solid #f0c987; border-radius: 14px; background: #fff6e5; color: #7a4500; font-size: 16px; font-weight: 600;">Not sure? Mark as needs verification</button>
  </div>

  <div role="status" style="margin: 0 16px 18px; min-height: 52px; border-radius: 14px; background: #111827; color: #ffffff; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 10px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86efac" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>
    <span style="flex: 1; font-size: 15px;">Saved. Moving on…</span>
    <button type="button" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #93c5fd; padding: 0 12px; font-size: 15px; font-weight: 700;">Undo</button>
  </div>
</div>
</body></html>
