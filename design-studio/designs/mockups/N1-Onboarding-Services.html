<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding · What do you offer?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#fff;font-family:Inter,system-ui,sans-serif;color:#111827}
button{font-family:inherit;cursor:pointer}
.tile{min-height:76px;border-radius:16px;border:1px solid #d1d5db;background:#fff;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;color:#111827}
.tile[aria-pressed=true]{border:2px solid #111827;background:#f3f4f6;padding:11px}
.tile svg{width:22px;height:22px}
.tile .t{font-size:15px;font-weight:600;line-height:1.25}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="padding:8px 8px 0;display:flex;align-items:center;gap:4px">
    <button type="button" aria-label="Back" style="width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span style="flex:1;font-size:15px;font-weight:600">Set up Harbourview · 2 of 4</span>
  </div>
  <div aria-hidden="true" style="margin:4px 16px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px"><span style="height:6px;border-radius:3px;background:#111827"></span><span style="height:6px;border-radius:3px;background:#111827"></span><span style="height:6px;border-radius:3px;background:#eef0f3"></span><span style="height:6px;border-radius:3px;background:#eef0f3"></span></div>

  <div style="flex:1;overflow:auto;padding:18px 16px 12px;display:flex;flex-direction:column;gap:14px">
    <h1 style="margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15">Which services does Harbourview offer?</h1>
    <p style="margin:0;font-size:15px;line-height:1.45;color:#374151">Tap all that apply. Each one gets its own short setup later, so nothing is wasted.</p>
    <div id="tiles" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
    <button type="button" style="align-self:flex-start;min-height:44px;border:0;background:transparent;padding:0;color:#1d4ed8;font-size:15px;font-weight:600">Show 9 more services</button>
  </div>

  <div style="margin:0 16px;border-radius:16px;background:#f6f7f9;padding:12px 14px;display:flex;flex-direction:column;gap:4px">
    <span style="font-size:14px;font-weight:700">Your plan so far</span>
    <span id="plan" style="font-size:14px;line-height:1.45;color:#374151"></span>
  </div>
  <div style="padding:12px 16px 18px">
    <button type="button" id="cont" style="width:100%;min-height:56px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:16px;font-weight:700"></button>
  </div>
</div>
<script>
var S=[['Dose administration aids','M4 7h16v12H4zM4 11h16M9 7v12M15 7v12',true],['Vaccination','M14 4l6 6M17 7l-9 9-3 1 1-3 9-9M5 19l2-2',true],['Opioid treatment (OTP)','M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z',true],['Home delivery','M3 7h11v9H3zM14 10h4l3 3v3h-7M7 19a2 2 0 1 0 0-.1M17 19a2 2 0 1 0 0-.1',true],['Medication reviews','M9 5h6M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1zM6 5H5v16h14V5h-1M9 13l2 2 4-4',false],['Pharmacist prescribing','M6 3h9l3 3v15H6zM9 12h6M9 16h4',true]];
var tiles=document.getElementById('tiles');
function draw(){tiles.innerHTML='';var n=0;S.forEach(function(s,i){if(s[2])n++;var b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-pressed',s[2]);b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+s[1]+'"/></svg><span class="t">'+s[0]+'</span>';b.onclick=function(){s[2]=!s[2];draw()};tiles.appendChild(b)});
document.getElementById('plan').textContent=n?n+' service setups you can do any time, in short sittings · a site visit every 8 weeks · a monthly check-in. You can change all of this.':'Pick at least one service to build your plan.';
document.getElementById('cont').textContent=n?'Continue with '+n+' service'+(n>1?'s':''):'Skip for now';}
draw();
</script>
</body>
</html>
