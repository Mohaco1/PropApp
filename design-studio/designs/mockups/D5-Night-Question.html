<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0f1218; color: #e6e9ef; font-family: Manrope, system-ui, sans-serif;">

    <button type="button" style="min-height: 44px; border: 0; background: transparent; color: #9aa3b2; font-size: 14px; font-weight: 700; padding: 0 8px;">Later</button>

    <span style="font-size: 14px; color: #9aa3b2;">Tap one. It saves straight away.</span>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;">
      
        <button type="button" aria-pressed="true" style="min-height: 70px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px; text-align: left; color: #e6e9ef; background: #1d2a40; border: 1px solid #6ea8fe;"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 700;">A pharmacist verifies it</span><span style="font-size: 13px; color: #9aa3b2;">Before any packing starts</span></span><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; color: #0f1218; background: #6ea8fe; border: 1px solid #6ea8fe;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg></span></button>
      
        <button type="button" aria-pressed="false" style="min-height: 70px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px; text-align: left; color: #e6e9ef; background: #171b23; border: 1px solid #2a3140;"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 700;">Different local arrangement</span><span style="font-size: 13px; color: #9aa3b2;">Describe it in one line</span></span><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; color: #0f1218; background: transparent; border: 1px solid #2a3140;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg></span></button>
      
        <button type="button" aria-pressed="false" style="min-height: 70px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px; text-align: left; color: #e6e9ef; background: #171b23; border: 1px solid #2a3140;"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 700;">No documented check yet</span><span style="font-size: 13px; color: #9aa3b2;">Adds a Task to help you set it up</span></span><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; color: #0f1218; background: transparent; border: 1px solid #2a3140;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg></span></button>

    </div>

    <button type="button" style="margin-top: auto; min-height: 54px; border: 1px solid #fbbf24; border-radius: 18px; background: rgba(251, 191, 36, 0.08); color: #fbbf24; font-size: 15px; font-weight: 700;">Not sure · mark to verify</button>
  </div>
