<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents · shelf and folders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#fff;font-family:Inter,system-ui,sans-serif;color:#111827}
button{font-family:inherit;cursor:pointer}
.shelf{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x mandatory;scroll-padding-left:16px}
.shelf::before,.shelf::after{content:"";flex:0 0 6px}
.doc{flex:0 0 150px;scroll-snap-align:start;border:1px solid #e5e7eb;border-radius:14px;background:#fff;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px;color:#111827}
.pg{height:52px;border-radius:6px;background:#f6f7f9;padding:7px;display:flex;flex-direction:column;gap:4px}
.pg i{display:block;height:4px;border-radius:2px;background:#cbd0d8}
.f{width:100%;min-height:60px;border:0;border-bottom:1px solid #eef0f3;background:#fff;display:flex;align-items:center;gap:12px;text-align:left;padding:6px 0;color:#111827}
.fi{width:38px;height:38px;border-radius:10px;background:#eef2ff;color:#1e3a8a;display:grid;place-items:center;flex:0 0 auto}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:center">
    <h1 style="margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em">Documents</h1>
    <button type="button" style="min-height:44px;border:0;background:transparent;color:#1d4ed8;font-size:15px;font-weight:600">Add file</button>
  </div>
  <h2 style="margin:8px 16px 6px;font-size:17px;font-weight:700">Needs your attention · 3</h2>
  <div class="shelf">
    <button type="button" class="doc"><span class="pg"><i style="width:70%"></i><i></i><i></i><i style="width:60%"></i></span><span style="font-size:15px;font-weight:600;line-height:1.3">DAA SOP</span><span style="font-size:13px;font-weight:700;color:#7a4500">Draft · 3 to verify</span></button>
    <button type="button" class="doc"><span class="pg"><i style="width:70%"></i><i></i><i></i><i style="width:60%"></i></span><span style="font-size:15px;font-weight:600;line-height:1.3">Business insurance</span><span style="font-size:13px;font-weight:700;color:#b42318">Your review date passed 2 Nov</span></button>
    <button type="button" class="doc"><span class="pg"><i style="width:70%"></i><i></i><i></i><i style="width:60%"></i></span><span style="font-size:15px;font-weight:600;line-height:1.3">Cold chain SOP</span><span style="font-size:13px;font-weight:700;color:#7a4500">Yearly review due Dec</span></button>
  </div>

  <div style="flex:1;overflow:auto;padding:4px 16px 12px">
    <h2 style="margin:10px 0 2px;font-size:17px;font-weight:700">Folders</h2>
    <button type="button" class="f"><span class="fi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6zM9 12h6M9 16h4"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">SOPs</span><span style="font-size:14px;color:#4b5563">16 approved · 1 draft</span></span><span style="color:#9ca3af">›</span></button>
    <button type="button" class="f"><span class="fi" style="background:#ecf8f0;color:#15803d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Approvals and registrations</span><span style="font-size:14px;color:#4b5563">6 files · 1 to verify</span></span><span style="color:#9ca3af">›</span></button>
    <button type="button" class="f"><span class="fi" style="background:#fff6e5;color:#8a4b00"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4zM8 7V5h8v2"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Insurance and business</span><span style="font-size:14px;color:#4b5563">4 files · 1 review date passed</span></span><span style="color:#9ca3af">›</span></button>
    <button type="button" class="f"><span class="fi" style="background:#f3f4f6;color:#374151"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Evidence photos</span><span style="font-size:14px;color:#4b5563">12 photos · from site visits</span></span><span style="color:#9ca3af">›</span></button>
    <button type="button" class="f"><span class="fi" style="background:#f3f4f6;color:#374151"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7V3M16 7V3M4 11h16M5 5h14v15H5z"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">Meeting notes</span><span style="font-size:14px;color:#4b5563">11 meetings this year</span></span><span style="color:#9ca3af">›</span></button>
    <p style="margin:14px 0 0;font-size:13px;line-height:1.45;color:#4b5563">Review dates are the ones you set. Files stay on this device and go into your backup.</p>
  </div>
  <div style="padding:10px 16px 18px;border-top:1px solid #eef0f3">
    <button type="button" style="width:100%;min-height:56px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:16px;font-weight:700">Create inspection pack</button>
  </div>
</div>
</body>
</html>
