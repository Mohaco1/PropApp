<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 Evidence Trail · Site visit check</title>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f8fafc; color: #0f172a; font-family: 'Source Sans 3', system-ui, sans-serif;">
  <div style="padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #cbd5e1; background: #ffffff;">
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 36px;">

      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #475569;">02 / 06</span>

  </div>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2;">Medicine storage and stock</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #3156c4; background: #eef2fb; border-radius: 4px; padding: 4px 7px;">§ Storage standards</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #475569; background: #f1f5f9; border-radius: 4px; padding: 4px 7px;">Last: Satisfactory · 23 Sep</span>
    </div>

    <div role="group" aria-label="Answer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; background: #ffffff;">
      
        <button type="button" aria-pressed="false" style="min-height: 56px; border: 0; border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; font-weight: 500; color: #0f172a; background: #ffffff; text-align: left;"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; background: #15803d;"></span>Satisfactory</button>
      
        <button type="button" aria-pressed="true" style="min-height: 56px; border: 0; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; font-weight: 700; color: #b42318; background: #fdf2f1; text-align: left;"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; background: #b42318;"></span>Issue</button>
      
        <button type="button" aria-pressed="false" style="min-height: 56px; border: 0; border-right: 1px solid #cbd5e1; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; font-weight: 500; color: #0f172a; background: #ffffff; text-align: left;"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; background: #a15c07;"></span>Needs verification</button>
      
        <button type="button" aria-pressed="false" style="min-height: 56px; border: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; font-weight: 500; color: #0f172a; background: #ffffff; text-align: left;"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; background: #475569;"></span>Not applicable</button>
      
    </div>

    <div style="border: 1px solid #cbd5e1; border-radius: 10px; background: #ffffff; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
      <label for="finding4" style="font-size: 14px; font-weight: 700;">What did you find?</label>
      <textarea id="finding4" rows="2" style="font-size: 15px; line-height: 1.45; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; padding: 10px; resize: none; color: #0f172a;">Fridge log missed two readings last week.</textarea>
      <div style="display: flex; gap: 8px;">
        <button type="button" style="flex: 1; min-height: 44px; border: 1px dashed #94a3b8; border-radius: 8px; background: #ffffff; color: #0f172a; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><path d="M12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>Add photo</button>
        <button type="button" style="flex: 1; min-height: 44px; border: 1px dashed #94a3b8; border-radius: 8px; background: #ffffff; color: #0f172a; font-size: 14px; font-weight: 600;">Attach record</button>
      </div>
    </div>

    <div style="border-left: 3px solid #b42318; background: #ffffff; border-radius: 0 10px 10px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #b42318;">TASK WILL BE RAISED</span>
      <span style="font-size: 15px; font-weight: 600;">Follow up fridge log gaps</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #475569;">due 25 Nov · stays open until you verify the fix</span>
    </div>
  </div>

  <div style="padding: 0 16px 18px;">
    <button type="button" style="width: 100%; min-height: 52px; border: 0; border-radius: 10px; background: #0f172a; color: #ffffff; font-size: 16px; font-weight: 600;">Save to trail · next check</button>
  </div>
</div>
