<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3 Field Kit · Site visit check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1d4ed8}a:hover{color:#1e40af}
button{font-family:inherit}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f5f7; color: #111827; font-family: Archivo, system-ui, sans-serif;">
  <div style="background: #111827; color: #ffffff; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 14px; font-weight: 800; letter-spacing: 0.04em;">SITE VISIT · HARBOURVIEW</span><span style="font-size: 14px; font-weight: 800; color: #facc15;">2 / 6</span></div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px;"><span style="height: 8px; border-radius: 4px; background: #22c55e;"></span><span style="height: 8px; border-radius: 4px; background: #facc15;"></span><span style="height: 8px; border-radius: 4px; background: #374151;"></span><span style="height: 8px; border-radius: 4px; background: #374151;"></span><span style="height: 8px; border-radius: 4px; background: #374151;"></span><span style="height: 8px; border-radius: 4px; background: #374151;"></span></div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.1;">Medicine storage and stock</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #d1d5db;">Fridge exceptions, recalls, expired stock since your last visit.</p>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <div role="group" aria-label="Answer" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      
        <button type="button" aria-pressed="false" style="min-height: 92px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 4px; color: #15803d; background: #ffffff; border: 2px solid #15803d;"><span aria-hidden="true" style="font-size: 26px; font-weight: 800; line-height: 1;">✓</span><span style="font-size: 12px; font-weight: 800; line-height: 1.15; text-align: center;">Satisfactory</span></button>
      
        <button type="button" aria-pressed="true" style="min-height: 92px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 4px; color: #ffffff; background: #b42318; border: 2px solid #b42318;"><span aria-hidden="true" style="font-size: 26px; font-weight: 800; line-height: 1;">!</span><span style="font-size: 12px; font-weight: 800; line-height: 1.15; text-align: center;">Issue</span></button>
      
        <button type="button" aria-pressed="false" style="min-height: 92px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 4px; color: #a15c07; background: #ffffff; border: 2px solid #a15c07;"><span aria-hidden="true" style="font-size: 26px; font-weight: 800; line-height: 1;">?</span><span style="font-size: 12px; font-weight: 800; line-height: 1.15; text-align: center;">Needs verifying</span></button>
      
        <button type="button" aria-pressed="false" style="min-height: 92px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 4px; color: #4b5563; background: #ffffff; border: 2px solid #4b5563;"><span aria-hidden="true" style="font-size: 26px; font-weight: 800; line-height: 1;">–</span><span style="font-size: 12px; font-weight: 800; line-height: 1.15; text-align: center;">N/A</span></button>
      
    </div>

    <span style="font-size: 15px; font-weight: 800;">What did you find? Tap one or more</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 700; color: #ffffff; background: #b42318; border: 2px solid #b42318;">Fridge log gaps</button>
      
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 700; color: #111827; background: #ffffff; border: 2px solid #d1d5db;">Expired stock</button>
      
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 700; color: #111827; background: #ffffff; border: 2px solid #d1d5db;">Recall not actioned</button>
      
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 700; color: #111827; background: #ffffff; border: 2px solid #d1d5db;">Storage too warm</button>
      
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 700; color: #111827; background: #ffffff; border: 2px solid #d1d5db;">Something else</button>
      
    </div>
    <div style="border-radius: 16px; background: #ffffff; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 15px; font-weight: 800;">A Task will be added</span>
      <span style="font-size: 14px; color: #374151;">“Fix fridge log gaps” · due in 7 days · you can change this</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; padding: 0 16px 18px;">
    <button type="button" style="min-height: 60px; border: 2px solid #111827; border-radius: 16px; background: #ffffff; color: #111827; font-size: 17px; font-weight: 800;">Previous</button>
    <button type="button" style="min-height: 60px; border: 0; border-radius: 16px; background: #111827; color: #facc15; font-size: 18px; font-weight: 800;">Next check</button>
  </div>
</div>
</body></html>
