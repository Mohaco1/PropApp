<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 Evidence Trail · Setup question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#3156c4}a:hover{color:#23429a}
button{font-family:inherit}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f8fafc; color: #0f172a; font-family: 'Source Sans 3', system-ui, sans-serif;">
  <div style="padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #cbd5e1; background: #ffffff;">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: #0f172a; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <span style="flex: 1; font-size: 15px; font-weight: 600;">DAA setup</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #475569; padding-right: 8px;">04 / 15</span>
  </div>

  <div style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #3156c4; background: #eef2fb; border-radius: 4px; padding: 4px 7px;">§ Pharmacy Board DAA guideline</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #475569; background: #f1f5f9; border-radius: 4px; padding: 4px 7px;">Good practice</span>
    </div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2;">Who checks the medication list before packing?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #334155;">This becomes one line in your DAA SOP. You can change it at any time.</p>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
      
        <button type="button" aria-pressed="true" style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; text-align: left; color: #0f172a; background: #ffffff; border: 2px solid #3156c4;">
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; border: 2px solid #3156c4;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #3156c4;"></span></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 600;">A pharmacist verifies it</span><span style="font-size: 13px; color: #475569;">Before any packing starts</span></span>
        </button>
      
        <button type="button" aria-pressed="false" style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; text-align: left; color: #0f172a; background: #ffffff; border: 1px solid #cbd5e1;">
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; border: 2px solid #94a3b8;"><span style="width: 10px; height: 10px; border-radius: 50%; background: transparent;"></span></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 600;">Different local arrangement</span><span style="font-size: 13px; color: #475569;">Describe it in one line</span></span>
        </button>
      
        <button type="button" aria-pressed="false" style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; text-align: left; color: #0f172a; background: #ffffff; border: 1px solid #cbd5e1;">
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; border: 2px solid #94a3b8;"><span style="width: 10px; height: 10px; border-radius: 50%; background: transparent;"></span></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 600;">No documented check yet</span><span style="font-size: 13px; color: #475569;">Adds a Task to help you set it up</span></span>
        </button>
      
    </div>

    <div style="margin-top: auto; border: 1px dashed #94a3b8; border-radius: 10px; background: #ffffff; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #475569;">YOUR SOP WILL SAY</span>
      <span style="font-size: 15px; line-height: 1.45;">“A pharmacist verifies the current medication list before any packing starts.”</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 0 16px 18px;">
    <button type="button" style="min-height: 52px; border: 1px solid #a15c07; border-radius: 10px; background: #fff8eb; color: #7a4500; font-size: 15px; font-weight: 600;">Mark to verify</button>
    <button type="button" style="min-height: 52px; border: 0; border-radius: 10px; background: #0f172a; color: #ffffff; font-size: 15px; font-weight: 600;">Continue</button>
  </div>
</div>
