<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5 Night Shift · Site visit check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#6ea8fe}a:hover{color:#9cc3ff}
button,textarea{font-family:inherit}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0f1218; color: #e6e9ef; font-family: Manrope, system-ui, sans-serif;">
  <div style="padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 32px;"><span style="font-size: 12px; font-weight: 700; color: #9aa3b2;">SITE VISIT · HARBOURVIEW</span><span style="font-size: 12px; font-weight: 700; color: #6ea8fe;">2 OF 6</span></div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px;"><span style="height: 4px; border-radius: 2px; background: #34d399;"></span><span style="height: 4px; border-radius: 2px; background: #6ea8fe;"></span><span style="height: 4px; border-radius: 2px; background: #232937;"></span><span style="height: 4px; border-radius: 2px; background: #232937;"></span><span style="height: 4px; border-radius: 2px; background: #232937;"></span><span style="height: 4px; border-radius: 2px; background: #232937;"></span></div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; line-height: 1.15;">Medicine storage and stock</h1>
    <p style="margin: -6px 0 0; font-size: 14px; line-height: 1.5; color: #9aa3b2;">Fridge exceptions, recalls and expired stock since 23 Sep.</p>

    <div role="group" aria-label="Answer" style="display: flex; flex-direction: column; gap: 8px;">
      
        <button type="button" aria-pressed="false" style="min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 16px; text-align: left; color: #e6e9ef; background: #171b23; border: 1px solid #2a3140;"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; background: #34d399;"></span><span style="flex: 1; font-size: 16px; font-weight: 700;">Satisfactory</span></button>
      
        <button type="button" aria-pressed="true" style="min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 16px; text-align: left; color: #e6e9ef; background: #2a1a1d; border: 1px solid #f87171;"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; background: #f87171;"></span><span style="flex: 1; font-size: 16px; font-weight: 700;">Issue</span></button>
      
        <button type="button" aria-pressed="false" style="min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 16px; text-align: left; color: #e6e9ef; background: #171b23; border: 1px solid #2a3140;"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; background: #fbbf24;"></span><span style="flex: 1; font-size: 16px; font-weight: 700;">Needs verification</span></button>
      
        <button type="button" aria-pressed="false" style="min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 16px; text-align: left; color: #e6e9ef; background: #171b23; border: 1px solid #2a3140;"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; background: #9aa3b2;"></span><span style="flex: 1; font-size: 16px; font-weight: 700;">Not applicable</span></button>
      
    </div>

    <div style="border: 1px solid #3a2326; border-radius: 18px; background: #1c1517; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
      <label for="finding5" style="font-size: 13px; font-weight: 700; color: #fca5a5;">What did you find?</label>
      <textarea id="finding5" rows="2" style="font-size: 15px; line-height: 1.45; border: 1px solid #3a2326; border-radius: 12px; background: #0f1218; padding: 10px; resize: none; color: #e6e9ef;">Fridge log missed two readings last week.</textarea>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 15px; font-weight: 600;">Create a Task to follow it up<span aria-hidden="true" style="width: 50px; height: 30px; border-radius: 999px; background: #6ea8fe; position: relative; flex: 0 0 auto;"><span style="position: absolute; right: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #0f1218;"></span></span></label>
    </div>
  </div>

  <div style="padding: 0 16px 18px;">
    <button type="button" style="width: 100%; min-height: 56px; border: 0; border-radius: 18px; background: #6ea8fe; color: #0f1218; font-size: 16px; font-weight: 800;">Save · next check</button>
  </div>
</div>
</body></html>
