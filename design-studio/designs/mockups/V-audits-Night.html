<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift · Audits</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>body{margin:0}button{font-family:inherit;cursor:pointer}main>*,.screen>*{flex-shrink:0}main{flex-shrink:1!important}.screen{width:390px;height:844px;display:flex;flex-direction:column;background:#0f1218;color:#e6e9ef;font-family:Manrope,system-ui,sans-serif}header{padding:20px 16px 8px;display:flex;flex-direction:column;gap:8px}.hi{font-size:14px;font-weight:600;color:#9aa3b2}h1{margin:0;font-size:28px;font-weight:800;line-height:1.15}header p{margin:0;font-size:15px;color:#b6bdc9}.cts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}.ct{border:1px solid #2a3140;border-radius:16px;background:#171b23;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#b6bdc9}.cn{font-size:24px;font-weight:800}main{flex:1;overflow:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:8px}h2{margin:10px 0 0;font-size:14px;font-weight:700;color:#9aa3b2}.card{border:1px solid #2a3140;border-radius:20px;background:#171b23;overflow:hidden}.row{width:100%;min-height:64px;border:0;border-bottom:1px solid #232937;background:transparent;padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:left;color:#e6e9ef}.card .row:last-child{border-bottom:0}.row.on{background:#1d2a40}.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}.txt{flex:1;display:flex;flex-direction:column;gap:2px}.rt{font-size:16px;font-weight:700}.rs{font-size:14px;color:#9aa3b2}.st{font-size:13px;font-weight:700;white-space:nowrap}footer{padding:8px 16px 18px}.cta{width:100%;min-height:56px;border:0;border-radius:18px;background:#6ea8fe;color:#0f1218;font-size:16px;font-weight:800}</style></head>
<body><div class="screen"><header><span class="hi">Good evening · Harbourview</span><h1>Audits</h1><p>8 audits in your plan. One is overdue.</p><div class="cts"><div class="ct"><span class="cn" style="color:#f87171">1</span><span>Overdue</span></div><div class="ct"><span class="cn" style="color:#fbbf24">2</span><span>Due soon</span></div><div class="ct"><span class="cn" style="color:#34d399">5</span><span>On track</span></div></div></header><main><h2>Overdue</h2><div class="card"><button type="button" class="row"><span class="dot" style="background:#f87171"></span><span class="txt"><span class="rt">Site visit</span><span class="rs">Every 8 weeks · last 23 Sep</span></span><span class="st" style="color:#f87171">Overdue 16 days</span></button></div><h2>Due soon</h2><div class="card"><button type="button" class="row"><span class="dot" style="background:#fbbf24"></span><span class="txt"><span class="rt">Cold chain review</span><span class="rs">Monthly · last 30 Oct</span></span><span class="st" style="color:#fbbf24">Due 30 Nov</span></button><button type="button" class="row"><span class="dot" style="background:#fbbf24"></span><span class="txt"><span class="rt">S8 stock check</span><span class="rs">Last 1 Sep</span></span><span class="st" style="color:#fbbf24">Due 1 Dec</span></button></div><h2>On track</h2><div class="card"><button type="button" class="row"><span class="dot" style="background:#34d399"></span><span class="txt"><span class="rt">DAA packing check</span><span class="rs">Monthly · last 4 Nov</span></span><span class="st" style="color:#34d399">Due 4 Dec</span></button><button type="button" class="row"><span class="dot" style="background:#34d399"></span><span class="txt"><span class="rt">Dispensary cleanliness</span><span class="rs">Monthly · last 9 Nov</span></span><span class="st" style="color:#34d399">Due 9 Dec</span></button></div></main><footer><button type="button" class="cta">Start site visit</button></footer></div></body></html>
