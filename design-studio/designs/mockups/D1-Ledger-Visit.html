<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1 Quiet Ledger · Site visit check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1d4ed8}a:hover{color:#1e40af}
button,textarea{font-family:inherit}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #111827; font-family: Inter, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px;">
    <button type="button" aria-label="Close site visit" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; color: #111827;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span style="font-size: 15px; font-weight: 600;">Site visit · Harbourview</span>
    <span style="width: 44px; text-align: right; font-size: 14px; color: #6b7280; font-variant-numeric: tabular-nums;">2/6</span>
  </div>
  <div style="height: 2px; background: #eef0f3; margin: 0 22px;"><div style="height: 2px; width: 33%; background: #111827;"></div></div>

  <div style="flex: 1; padding: 26px 22px 0; display: flex; flex-direction: column; gap: 10px;">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.12;">Medicine storage and stock</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4b5563;">Storage conditions, fridge temperature exceptions, recalls and expired stock since your last visit.</p>

    <div style="margin-top: 14px; display: flex; flex-direction: column; border-top: 1px solid #eef0f3;">
      
        <button type="button" aria-pressed="false" style="min-height: 56px; display: flex; align-items: center; gap: 14px; border: 0; border-bottom: 1px solid #eef0f3; padding: 0 2px; text-align: left; color: #111827; background: transparent;"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: 0 0 auto; color: #166534; background: transparent; border: 2px solid #166534;">✓</span><span style="flex: 1; font-size: 17px; font-weight: 600;">Satisfactory</span></button>
      
        <button type="button" aria-pressed="true" style="min-height: 56px; display: flex; align-items: center; gap: 14px; border: 0; border-bottom: 1px solid #eef0f3; padding: 0 2px; text-align: left; color: #111827; background: #fdf3f2;"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: 0 0 auto; color: #ffffff; background: #b42318; border: 2px solid #b42318;">!</span><span style="flex: 1; font-size: 17px; font-weight: 600;">Issue</span><span style="font-size: 13px; font-weight: 600; color: #9b1c1c;">Selected</span></button>
      
        <button type="button" aria-pressed="false" style="min-height: 56px; display: flex; align-items: center; gap: 14px; border: 0; border-bottom: 1px solid #eef0f3; padding: 0 2px; text-align: left; color: #111827; background: transparent;"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: 0 0 auto; color: #a15c07; background: transparent; border: 2px solid #a15c07;">?</span><span style="flex: 1; font-size: 17px; font-weight: 600;">Needs verification</span></button>
      
        <button type="button" aria-pressed="false" style="min-height: 56px; display: flex; align-items: center; gap: 14px; border: 0; border-bottom: 1px solid #eef0f3; padding: 0 2px; text-align: left; color: #111827; background: transparent;"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: 0 0 auto; color: #4b5563; background: transparent; border: 2px solid #4b5563;">–</span><span style="flex: 1; font-size: 17px; font-weight: 600;">Not applicable</span></button>
      
    </div>

    <label for="finding" style="margin-top: 16px; font-size: 15px; font-weight: 600;">What did you find?</label>
    <textarea id="finding" rows="2" style="font-size: 16px; line-height: 1.45; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 12px; resize: none; color: #111827;">Fridge log missed two readings last week.</textarea>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 16px; font-weight: 500;"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #111827;">Create a Task to follow it up</label>
  </div>

  <div style="padding: 10px 22px 22px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eef0f3;">
    <button type="button" style="min-height: 44px; border: 0; background: transparent; padding: 0; font-size: 15px; font-weight: 600; color: #111827;">Back</button>
    <button type="button" style="min-height: 48px; border: 0; border-radius: 999px; background: #111827; color: #ffffff; padding: 0 24px; font-size: 16px; font-weight: 600;">Next check</button>
  </div>
</div>
</body></html>
