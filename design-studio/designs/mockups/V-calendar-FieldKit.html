<style>body{margin:0}button{font-family:inherit;cursor:pointer}main>*,.screen>*{flex-shrink:0}main{flex-shrink:1!important}.screen{width:390px;height:844px;display:flex;flex-direction:column;background:#f4f5f7;color:#111827;font-family:Archivo,system-ui,sans-serif}header{background:#111827;color:#fff;padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}.top{display:flex;justify-content:space-between;font-size:14px;font-weight:800;letter-spacing:.04em}.y{color:#facc15}h1{margin:0;font-size:30px;font-weight:800;line-height:1.08}header p{margin:0;font-size:15px;color:#d1d5db}.cts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ct{background:#1f2937;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#e5e7eb}.cn{font-size:24px;font-weight:800}main{flex:1;overflow:auto;padding:6px 16px 12px;display:flex;flex-direction:column;gap:10px}h2{margin:10px 0 0;font-size:13px;font-weight:800;letter-spacing:.06em;color:#374151}.row{min-height:72px;border:2px solid #111827;border-radius:16px;background:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;color:#111827}.row.on{background:#111827;color:#fff}.row.on .rs{color:#d1d5db}.txt{flex:1;display:flex;flex-direction:column;gap:3px}.rt{font-size:17px;font-weight:800;line-height:1.2}.rs{font-size:14px;color:#374151}.pill{font-size:13px;font-weight:800;border-radius:8px;padding:5px 8px;white-space:nowrap}footer{padding:0 16px 18px}.cta{width:100%;min-height:60px;border:0;border-radius:16px;background:#facc15;color:#111827;font-size:18px;font-weight:800}</style></head>
