<style>body{margin:0}button{font-family:inherit;cursor:pointer}main>*,.screen>*{flex-shrink:0}main{flex-shrink:1!important}.screen{width:390px;height:844px;display:flex;flex-direction:column;background:#0f1218;color:#e6e9ef;font-family:Manrope,system-ui,sans-serif}header{padding:20px 16px 8px;display:flex;flex-direction:column;gap:8px}.hi{font-size:14px;font-weight:600;color:#9aa3b2}h1{margin:0;font-size:28px;font-weight:800;line-height:1.15}header p{margin:0;font-size:15px;color:#b6bdc9}.cts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}.ct{border:1px solid #2a3140;border-radius:16px;background:#171b23;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#b6bdc9}.cn{font-size:24px;font-weight:800}main{flex:1;overflow:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:8px}h2{margin:10px 0 0;font-size:14px;font-weight:700;color:#9aa3b2}.card{border:1px solid #2a3140;border-radius:20px;background:#171b23;overflow:hidden}.row{width:100%;min-height:64px;border:0;border-bottom:1px solid #232937;background:transparent;padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:left;color:#e6e9ef}.card .row:last-child{border-bottom:0}.row.on{background:#1d2a40}.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}.txt{flex:1;display:flex;flex-direction:column;gap:2px}.rt{font-size:16px;font-weight:700}.rs{font-size:14px;color:#9aa3b2}.st{font-size:13px;font-weight:700;white-space:nowrap}footer{padding:8px 16px 18px}.cta{width:100%;min-height:56px;border:0;border-radius:18px;background:#6ea8fe;color:#0f1218;font-size:16px;font-weight:800}</style></head>
