<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonlitt → plan your visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1d4ed8}a:hover{color:#1e40af}
button{font-family:inherit}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #111827; font-family: Inter, system-ui, sans-serif;">
  <div style="padding: 8px 8px 0; display: flex; align-items: center; gap: 4px;">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: #111827; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <span style="flex: 1; font-size: 15px; font-weight: 600;">Plan your site visit</span>
  </div>

  <div style="display: grid; place-items: center; padding: 6px 0 0; position: relative;">
    <svg width="280" height="280" viewBox="-12 -12 304 304" role="img" aria-label="Visit cycle: 8 weeks from 23 Sep, now 16 days past the end">
      <circle cx="140" cy="140" r="112" fill="none" stroke="#eef0f3" stroke-width="22"></circle>
      <circle cx="140" cy="140" r="112" fill="none" stroke="#111827" stroke-width="22"></circle>
      <circle cx="140" cy="140" r="138" fill="none" stroke="#b42318" stroke-width="8" stroke-linecap="round" stroke-dasharray="248 867" transform="rotate(-90 140 140)"></circle>
      <g stroke="#ffffff" stroke-width="3"><line x1="140" y1="16" x2="140" y2="40"></line><line x1="227.7" y1="52.3" x2="210.7" y2="69.3"></line><line x1="264" y1="140" x2="240" y2="140"></line><line x1="227.7" y1="227.7" x2="210.7" y2="210.7"></line><line x1="140" y1="264" x2="140" y2="240"></line><line x1="52.3" y1="227.7" x2="69.3" y2="210.7"></line><line x1="16" y1="140" x2="40" y2="140"></line><line x1="52.3" y1="52.3" x2="69.3" y2="69.3"></line></g>
      <circle cx="274.5" cy="170.8" r="10" fill="#b42318" stroke="#ffffff" stroke-width="4"></circle>
    </svg>
    <div style="position: absolute; top: 96px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span style="font-size: 14px; color: #4b5563;">Cycle started 23 Sep</span>
      <span style="font-size: 34px; font-weight: 800; letter-spacing: -0.03em; color: #b42318; font-variant-numeric: tabular-nums;">+16 days</span>
      <span style="font-size: 14px; color: #4b5563;">past your 8-week plan</span>
    </div>
  </div>

  <div style="flex: 1; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 16px; font-weight: 700;">Visit on</span><span style="font-size: 20px; font-weight: 800; color: #1d4ed8;">Tue 24 Nov</span></div>
      <div aria-hidden="true" style="position: relative; height: 44px; display: flex; align-items: center;">
        <div style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: #eef0f3;"></div>
        <div style="position: absolute; left: 0; width: 38%; height: 6px; border-radius: 3px; background: #1d4ed8;"></div>
        <div style="position: absolute; left: calc(38% - 14px); width: 28px; height: 28px; border-radius: 50%; background: #ffffff; border: 3px solid #1d4ed8; box-shadow: 0 2px 6px rgba(17, 24, 39, 0.18);"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #4b5563;"><span>Today</span><span>+1 week</span><span>+2 weeks</span></div>
    </div>

    <div style="border-radius: 16px; background: #f6f7f9; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 15px; font-weight: 700;">That visit could also cover</span>
      
        <div style="display: flex; gap: 10px; align-items: flex-start;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px;"><path d="M5 12l4 4 10-10"></path></svg><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Proprietor check-in</span><span style="font-size: 14px; color: #4b5563;">Due 25 Nov · one day early</span></span></div>
      
        <div style="display: flex; gap: 10px; align-items: flex-start;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px;"><path d="M5 12l4 4 10-10"></path></svg><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Look at the fridge log fix</span><span style="font-size: 14px; color: #4b5563;">Task due 25 Nov · close it on the spot</span></span></div>
      
    </div>

    <button type="button" style="margin-top: auto; min-height: 56px; border: 0; border-radius: 14px; background: #111827; color: #ffffff; font-size: 16px; font-weight: 700;">Book Tue 24 Nov</button>
  </div>
</div>
</body></html>
