<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1 Quiet Ledger · Setup question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1d4ed8}a:hover{color:#1e40af}
button{font-family:inherit}
</style>
</head><body>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #111827; font-family: Inter, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px;">
    <button type="button" aria-label="Close setup" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; color: #111827;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span style="font-size: 15px; font-weight: 600;">Dose administration aids</span>
    <span style="width: 44px; text-align: right; font-size: 14px; color: #6b7280; font-variant-numeric: tabular-nums;">4/15</span>
  </div>
  <div style="height: 2px; background: #eef0f3; margin: 0 22px;"><div style="height: 2px; width: 27%; background: #111827;"></div></div>

  <div style="flex: 1; padding: 34px 22px 0; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280;">Safeguards</span>
    <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.12;">Who checks the medication list before packing?</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4b5563;">Your answer goes into the DAA procedure draft. Choose what happens today, not what should happen.</p>

    <div style="margin-top: 22px; display: flex; flex-direction: column; border-top: 1px solid #eef0f3;">
      
        <button type="button" aria-pressed="true" style="min-height: 64px; display: flex; align-items: center; gap: 16px; border: 0; border-bottom: 1px solid #eef0f3; background: transparent; padding: 0 2px; text-align: left; color: #111827;">
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; flex: 0 0 auto; border: 7px solid #111827;"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">A pharmacist verifies it</span><span style="font-size: 14px; color: #6b7280;">Before any packing starts</span></span>
        </button>
      
        <button type="button" aria-pressed="false" style="min-height: 64px; display: flex; align-items: center; gap: 16px; border: 0; border-bottom: 1px solid #eef0f3; background: transparent; padding: 0 2px; text-align: left; color: #111827;">
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; flex: 0 0 auto; border: 2px solid #9ca3af;"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">A different local arrangement</span><span style="font-size: 14px; color: #6b7280;">You describe it in one line</span></span>
        </button>
      
        <button type="button" aria-pressed="false" style="min-height: 64px; display: flex; align-items: center; gap: 16px; border: 0; border-bottom: 1px solid #eef0f3; background: transparent; padding: 0 2px; text-align: left; color: #111827;">
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; flex: 0 0 auto; border: 2px solid #9ca3af;"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">No documented check yet</span><span style="font-size: 14px; color: #6b7280;">Adds a Task to help you set one up</span></span>
        </button>
      
    </div>
  </div>

  <div style="padding: 0 22px 22px; display: flex; flex-direction: column; gap: 14px;">
    <button type="button" style="align-self: flex-start; min-height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #7a4b00;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #a15c07; box-sizing: border-box; background: linear-gradient(90deg, #a15c07 50%, transparent 50%);"></span>Not sure? Mark as needs verification</button>
    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eef0f3; padding-top: 10px;">
      <button type="button" style="min-height: 44px; border: 0; background: transparent; padding: 0; font-size: 15px; font-weight: 600; color: #111827;">Back</button>
      <span style="font-size: 13px; color: #6b7280;">Saved as you go</span>
      <button type="button" style="min-height: 44px; border: 0; background: transparent; padding: 0; font-size: 15px; font-weight: 600; color: #111827;">Later</button>
    </div>
  </div>
</div>
</body></html>
